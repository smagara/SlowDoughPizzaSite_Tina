# Build & deploy the website to GitHub Pages whenever content or code lands on `main`.
#
# Content changes arrive on `main` exclusively through reviewed Pull Requests opened by the staff
# editor (branches `cms/<user>/<timestamp>`), so a merge == an approved publish.
#
# Action versions: Dependabot (.github/dependabot.yml) opens a PR whenever a newer major of any
# action below is published (e.g. Node 24 runtimes), so these pins never silently go stale.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; never cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Tests (includes content validation)
        run: npm test

      - name: Build site
        env:
          # Served from https://<owner>.github.io/<repo>/ – assets must be prefixed with the repo name.
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GITHUB_OWNER: ${{ github.repository_owner }}
          VITE_GITHUB_REPO: ${{ github.event.repository.name }}
          VITE_GITHUB_BASE_BRANCH: main
        run: npm run build

      # Package the site exactly the way actions/upload-pages-artifact does (a single artifact.tar
      # named "github-pages"), but with a current actions/upload-artifact. upload-pages-artifact
      # pins an older, Node 20 upload-artifact internally, which is what produced the
      # "Node.js 20 is deprecated" warning on the build job.
      - name: Package site for GitHub Pages
        run: tar --dereference --hard-dereference --directory dist -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - uses: actions/upload-artifact@v5
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # actions/deploy-pages has not shipped a Node 24 major yet (Dependabot will open a PR when it
      # does). Opting in explicitly runs it on Node 24 – which is what the runner already does – and
      # records that the choice is deliberate.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
