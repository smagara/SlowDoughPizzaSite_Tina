# Pull Request checks. Runs for every PR – including the `cms/**` branches created by the staff
# editor – so reviewers see a green check before approving content changes.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Validate content files against the Tina schema
        run: npm run validate:content

      - name: Unit & component tests
        run: npm test

      - name: Production build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Tina schema audit (local mode)
        run: npm run tina:audit
